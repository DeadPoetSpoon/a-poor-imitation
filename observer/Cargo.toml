[package]
name = "observer"
version = "0.1.0"
edition = "2024"

[features]
dev = ["base/dev", "bevy/dev"]
rls = ["base/rls"]

[dependencies]
base = { path = "../base" }
bevy = { workspace = true, features = ["2d"] }
bevy_replicon = { workspace = true, features = ["client"] }
bevy_replicon_renet2 = { workspace = true, features = ["client", "native_transport"] }
