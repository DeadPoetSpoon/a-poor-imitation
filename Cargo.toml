[workspace]
members = ["base", "world", "observer", "touchpad"]
resolver = "3"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false }
bevy_replicon = { version = "0.41.1", default-features = false }
bevy_replicon_renet2 = { version = "0.19.1", default-features = false }
serde = { version = "1", features = ["derive"] }
